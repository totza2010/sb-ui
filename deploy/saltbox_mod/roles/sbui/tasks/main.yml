---
- name: Add DNS record
  ansible.builtin.include_tasks: "{{ resources_tasks_path }}/dns/tasker.yml"
  vars:
    dns_record: "{{ lookup('role_var', '_dns_record') }}"
    dns_zone: "{{ lookup('role_var', '_dns_zone') }}"
    dns_proxy: "{{ lookup('role_var', '_dns_proxy') }}"

- name: Stop Service
  ansible.builtin.include_tasks: "{{ resources_tasks_path }}/systemd/stop_service.yml"
  vars:
    _service_name: "{{ sbui_service_name }}"

- name: Create directories
  ansible.builtin.include_tasks: "{{ resources_tasks_path }}/directories/create_directories.yml"

- name: "Persist the self-update channel ({{ sbui_channel }})"
  ansible.builtin.copy:
    dest: "{{ sbui_data_path }}/cache/update_channel"
    content: "{{ sbui_channel }}"
    owner: "{{ user.name }}"
    group: "{{ user.name }}"
    mode: "0644"
    force: true

# The API denies /api and /ws without a session or a token, so scripts and the CLI need a
# token to work with. It is generated once and then left alone: regenerating it on every
# `sb install sbui` would silently break whatever was already using it.
- name: "Look for an existing API token"
  ansible.builtin.slurp:
    src: "{{ sbui_data_path }}/.env"
  register: sbui_env_file
  failed_when: false
  changed_when: false

- name: "Note whether a token is already configured"
  ansible.builtin.set_fact:
    sbui_token_present: "{{ 'SB_UI_TOKEN=' in (sbui_env_file.content | default('') | b64decode) }}"

- name: "Generate the API token (first install only)"
  ansible.builtin.lineinfile:
    path: "{{ sbui_data_path }}/.env"
    regexp: "^SB_UI_TOKEN="
    line: "SB_UI_TOKEN={{ lookup('password', '/dev/null length=48 chars=ascii_letters,digits') }}"
    create: true
    owner: "{{ user.name }}"
    group: "{{ user.name }}"
    mode: "0600"
  when: not sbui_token_present

- name: "Show where the API token lives"
  ansible.builtin.debug:
    msg:
      - "API token: {{ sbui_data_path }}/.env  (SB_UI_TOKEN — for scripts and the CLI)"
      - "Browser sign-in needs a password, which is set on this host and never over the API:"
      - "  {{ sbui_binary_path }} --set-password"
  when: not sbui_token_present

- name: "Get {{ sbui_channel }} sb-ui release metadata"
  ansible.builtin.include_tasks: "{{ resources_tasks_path }}/git/github_api_request.yml"
  vars:
    github_api_url: "{{ sbui_releases_url }}"
    github_api_result_var: sbui_latest_release_api

- name: "Get URL for the {{ sbui_channel }} sb-ui release ({{ sbui_asset_name }})"
  ansible.builtin.set_fact:
    sbui_latest_download_url: "{{ ((sbui_latest_release_api.content | from_json).assets
                                | selectattr('name', 'equalto', sbui_asset_name)
                                | map(attribute='browser_download_url')
                                | first) }}"
  changed_when: false

- name: "Download sb-ui binary"
  ansible.builtin.get_url:
    url: "{{ sbui_latest_download_url }}"
    dest: "{{ sbui_binary_path }}"
    owner: "{{ user.name }}"
    group: "{{ user.name }}"
    mode: "0755"
    force: true
  register: x
  until: "x is not failed"
  retries: "{{ ansible_retry_count
            if (not continuous_integration)
            else ansible_retry_count_ci }}"
  delay: 10

- name: Import 'sbui.yml' Traefik file provider
  ansible.builtin.template:
    src: "sbui.yml.j2"
    dest: "{{ lookup('role_var', '_paths_location', role='traefik') }}/{{ sbui_name }}.yml"
    owner: "{{ user.name }}"
    group: "{{ user.name }}"
    mode: "0644"
    force: true

- name: "Import '{{ sbui_service_name }}.service'"
  ansible.builtin.template:
    src: sbui.service.j2
    dest: "/etc/systemd/system/{{ sbui_service_name }}.service"
    mode: "0644"
    force: true

- name: Start service
  ansible.builtin.include_tasks: "{{ resources_tasks_path }}/systemd/manage_service.yml"
  vars:
    _service_name: "{{ sbui_service_name }}"
    _service_state: started
    _service_enabled: true
    _service_daemon_reload: true
    _service_reenable: true
